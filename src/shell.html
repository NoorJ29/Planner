<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova</title>
<meta name="theme-color" content="#0F7B6C">
<meta name="description" content="Plan your days, build habits, keep notes and track spending, synced across your devices.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
<script>/* launch screen: when opened as the installed app (or with ?launch=1 to preview) */
if(matchMedia("(display-mode: standalone)").matches||navigator.standalone===true||/[?&]launch=1/.test(location.search))document.documentElement.classList.add("launching");</script>
<script src="config.js"></script>
<style>
/*CSS*/
</style>
</head>
<body>
<div id="launch" aria-hidden="true">
  <div class="lsky"></div>
  <div class="lcenter">
    <svg class="lmark" viewBox="80 60 360 380">
      <defs><radialGradient id="lglow"><stop offset="0" stop-color="#FFE7A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE7A8" stop-opacity="0"/></radialGradient></defs>
      <path class="ll l1" pathLength="1" d="M166 366L166 160"/><path class="ll l2" pathLength="1" d="M166 160L346 352"/><path class="ll l3" pathLength="1" d="M346 352L346 150"/>
      <circle class="ln n1" cx="166" cy="366" r="16"/><circle class="ln n2" cx="166" cy="160" r="20"/><circle class="ln n3" cx="346" cy="352" r="18"/>
      <circle class="lglow" cx="346" cy="150" r="92" fill="url(#lglow)"/>
      <path class="lstar" d="M346 94c6 36 20 50 56 56c-36 6-50 20-56 56c-6-36-20-50-56-56c36-6 50-20 56-56z"/>
    </svg>
    <div class="lword">Nova</div>
    <div class="ltag">Plan your day. Shine brighter.</div>
  </div>
</div>
<aside class="side" aria-label="Sidebar">
  <div class="brand"><img src="icon-192.png" alt="" width="34" height="34"><b>Nova</b></div>
  <button class="side-search" id="sideSearch"><span>Search</span><kbd>/</kbd></button>
  <nav class="side-nav" id="sideNav" aria-label="Sections"></nav>
  <div class="side-foot">
    <button class="installbtn side-install" id="sideInstall" hidden><span aria-hidden="true">⬇</span> Install Nova app</button>
    <button class="sync pcard" aria-label="Sync and account"><b class="pav" aria-hidden="true"><em></em><i></i></b><span>Starting…</span><small class="pmail"></small><em class="pchev" aria-hidden="true">›</em><u class="tip" aria-hidden="true"></u></button>
    <div class="side-set">
      <button id="sideSettings" data-tab="settings"><span class="ico emo">⚙️</span><span>Settings</span></button>
      <button class="qbtn" id="sideGuide" aria-label="Guide and shortcuts" title="Guide and shortcuts (?)">?</button>
    </div>
  </div>
</aside>
<div class="wrap">
  <header class="top">
    <div class="ttl"><h1 class="date-big" id="bigDate">Nova</h1><div class="date-sub" id="subDate"></div></div>
    <div class="hact">
      <div class="hrow"><button class="installbtn" id="installBtn" hidden aria-label="Install Nova"><span aria-hidden="true">⬇</span> Install</button><button class="hbtn" id="homeCustom" hidden aria-label="Customise home" data-tip="Customise home"></button><button class="hbtn" id="searchBtn" aria-label="Search"></button></div>
      <button class="sync" id="sync" aria-label="Sync and account"><b class="pav" aria-hidden="true"><em></em><i></i></b><span>Starting…</span></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<button class="fpill" id="focusPill" hidden aria-label="Open focus timer"><i></i><b>25:00</b><span>Focus</span></button>
<div class="dock">
  <div class="qahint" id="qaHint" hidden aria-live="polite"></div>
  <form class="qa" id="qaForm" autocomplete="off">
    <input id="qaInput" placeholder="Add a task" aria-label="Quick add">
    <button type="button" class="more" id="qaMore" aria-label="Add with details">＋</button>
    <button type="submit" class="add">Add</button>
  </form>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
</div>
<script>
(function(){
"use strict";
/*JS*/
})();
</script>
</body>
</html>
