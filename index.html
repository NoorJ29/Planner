<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<meta name="theme-color" content="#0F7B6C">
<meta name="description" content="Plan your days, build habits, keep notes and track spending, synced across your devices.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
<script src="config.js"></script>
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunken:#E3E9E6; --ink:#16302B; --muted:#5B6F6A; --line:#D3DCD8;
  --accent:#0F7B6C; --accent-ink:#FFFFFF; --sun:#E9A21F; --danger:#B8433A; --good:#1E8A4C;
  --shadow:0 10px 30px rgba(22,48,43,.14);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1917; --surface:#15231F; --sunken:#1B2C28; --ink:#E4EEEA; --muted:#93A9A3; --line:#284039;
    --accent:#3DB8A2; --accent-ink:#06201B; --sun:#F2B544; --danger:#E0786E; --good:#5CC98A; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1917; --surface:#15231F; --sunken:#1B2C28; --ink:#E4EEEA; --muted:#93A9A3; --line:#284039;
  --accent:#3DB8A2; --accent-ink:#06201B; --sun:#F2B544; --danger:#E0786E; --good:#5CC98A; --shadow:0 10px 30px rgba(0,0,0,.45);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 200px}
body.noqa .wrap{padding-bottom:130px}
.ico{display:inline-flex}
.ico.emo{width:22px;height:22px;align-items:center;justify-content:center;font-size:18px;line-height:1}
.navprev{margin:0 0 8px;padding:8px 12px;border-radius:12px;background:var(--sunken);font-weight:600}
.ico svg{width:22px;height:22px}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ttl{min-width:0}
.date-big{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,50px);line-height:.95;letter-spacing:-.02em;margin:0}
.date-sub{color:var(--muted);margin-top:6px;font-size:15px}
.hact{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto}
.hbtn{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;border:0;background:transparent;border-radius:10px;padding:6px 2px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--accent)}
.sync.offline i{background:var(--sun)}
.sync.error i{background:var(--danger)}
.sync{position:relative}
.pav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--c,var(--accent));flex:0 0 auto}
.sync .pav{display:none}
.sync.user .pav{display:grid}
.sync.user > i{position:absolute;left:26px;top:30px;width:11px;height:11px;border:2px solid var(--bg)}
#sync.user span{display:none}
.hact.user{flex-direction:row;align-items:center;gap:8px}
#sync.user{padding:0}
#sync.user .pav{width:42px;height:42px;font-size:17px}
#sync.user > i{left:31px;top:31px}
.pav.big{width:64px;height:64px;font-size:28px;font-family:var(--display)}
.prof{display:flex;align-items:center;gap:16px}
.pinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.pinfo .small{overflow:hidden;text-overflow:ellipsis}
.pname{font-family:var(--display);font-size:22px;font-weight:700}
.pstat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:4px}
.pstat i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.pstat.cloud i{background:var(--accent)}
.pstat.offline i{background:var(--sun)}
.pstat.error i{background:var(--danger)}
.pform{display:flex;flex-direction:column;gap:8px}
.card.dz{border-color:var(--danger)}
.btn.dzbtn{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}

/* segmented controls */
.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.seg{display:inline-flex;background:var(--sunken);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.jump{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:3px;background:var(--sunken);border-radius:14px;padding:4px;margin-top:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 0;font-weight:600;font-size:13.5px;color:var(--muted);min-width:0}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* week strip */
.strip-row{margin:8px -18px 0;padding:0 18px}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:4px 2px 6px}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;scroll-snap-align:center;border:0;background:transparent;border-radius:16px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .wd{font-size:12px;color:var(--muted)}
.day .dn{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.day .dots{display:flex;gap:3px;height:6px;margin-top:3px}
.day .dots b{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.today .dn{color:var(--sun)}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel .wd{color:inherit;opacity:.7}
.day.sel .dots b{background:var(--bg)}
.day.past:not(.sel){opacity:.55}

/* month */
.month{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 8px 10px;touch-action:pan-y}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 6px 8px}
.mhead h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0;letter-spacing:-.01em}
.mnav{border:0;background:var(--sunken);width:38px;height:38px;border-radius:12px;font-size:18px;line-height:1;color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mwd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 6px}
.mc{border:0;background:transparent;border-radius:12px;min-height:48px;display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;gap:4px;min-width:0}
.mc .num{font-weight:600;font-size:15px;line-height:1.2}
.mc.has{background:var(--sunken)}
.mc.out{opacity:.35}
.mc.today .num{color:var(--sun);font-weight:800}
.mc.sel{background:var(--ink);color:var(--bg)}
.mc.sel .num{color:var(--bg)}
.mdots{display:flex;gap:2px;align-items:center;height:7px}
.mdots b{width:6px;height:6px;border-radius:50%}
.mdots i{font-style:normal;font-size:10px;font-weight:700;color:var(--muted);line-height:7px}
.mc.sel .mdots i{color:var(--bg)}
.mc.sel .mdots b{outline:1px solid var(--bg)}
.mc.late .mdots b{background:var(--danger)!important}
.mdone{font-size:11px;line-height:7px;color:var(--accent)}
.msum{font-size:13px;color:var(--muted);padding:10px 6px 0}

/* sections & cards */
.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sec-h .n{color:var(--muted);font-size:14px}
.sec-h.overdue h2{color:var(--danger)}
.progress{height:5px;background:var(--sunken);border-radius:5px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.progress.over b{background:var(--danger)}
.sec .progress{margin:-2px 0 12px}
.ldot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.cards{display:grid;gap:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:22px 18px;color:var(--muted);text-align:center}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.linkbtn.danger{color:var(--danger)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunken)}
.btn.danger{background:transparent;color:var(--danger);padding-left:4px;padding-right:4px}
.btn.wide{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:2px solid var(--c,var(--accent));background:transparent;display:grid;place-items:center;padding:0;margin-top:-1px;transition:background .15s}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:.15s;stroke:var(--surface)}
.task.done .check,.check.on{background:var(--c,var(--accent))}
.task.done .check svg,.check.on svg{opacity:1;transform:none}
.check.sm{flex-basis:22px;width:22px;height:22px}
.check.sm svg{width:12px;height:12px}
.tbody{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.ttitle{display:block;font-weight:500;overflow-wrap:anywhere}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);margin-top:3px}
.meta .late{color:var(--danger);font-weight:600}
.pri{font-family:var(--display);font-weight:800;color:var(--sun);flex:0 0 auto;font-size:15px;padding-top:1px}
.pri.p2{color:var(--danger)}

/* schedule */
.anytime{display:flex;gap:8px;flex-wrap:wrap}
.tl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:copy}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hr span{position:absolute;left:8px;top:-1px;font-size:11px;color:var(--muted);background:var(--surface);padding:0 4px;transform:translateY(-50%)}
.hr:first-child{border-top:0}
.hr:first-child span{transform:none;top:4px}
.blk{position:absolute;border-radius:10px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface));padding:5px 30px 5px 8px;overflow:hidden;cursor:pointer;font-size:13px;line-height:1.25;min-height:22px}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{color:var(--muted);font-size:12px}
.blk.done b{text-decoration:line-through;opacity:.6}
.blk.drag{box-shadow:var(--shadow);z-index:3;opacity:.95}
.grip{position:absolute;right:2px;top:2px;width:26px;height:26px;border:0;background:transparent;color:var(--muted);touch-action:none;cursor:grab;font-size:14px;line-height:1;border-radius:8px}
.now{position:absolute;left:44px;right:0;border-top:2px solid var(--danger);pointer-events:none;z-index:2}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 78%,transparent)}
.qa{max-width:720px;margin:0 auto 8px;display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
body.noqa .qa{display:none}
.qa input{flex:1;min-width:0;border:0;background:transparent;padding:10px;font-size:16px;outline:none}
.qa .more{border:0;background:var(--sunken);border-radius:12px;width:44px;font-size:20px;color:var(--muted)}
.qa .add{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 18px;font-weight:600}
.nav{max-width:720px;margin:0 auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px;box-shadow:var(--shadow)}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border-radius:15px;color:var(--muted);font-size:11px;font-weight:600;min-width:0}
.nav button[aria-current="page"]{color:var(--accent);background:var(--sunken)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,20,17,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;overscroll-behavior:contain}
.sheet.full{height:92%;display:flex;flex-direction:column}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;padding-bottom:20px}.sheet.full{height:86%}}
.sheet h3{font-family:var(--display);font-size:20px;margin:0 0 14px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.shead h3{margin:0}
.field{margin-top:16px}
.field > label,.field > .lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.lbl-in{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.inp.title{font-size:19px;font-weight:600}
.inp.amt{font-family:var(--display);font-size:34px;font-weight:700;text-align:center;padding:14px}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .inp{flex:1;min-width:120px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:22px;align-items:center}
.sheet:not(.full) .actions{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--surface);margin:22px -20px calc(-20px - env(safe-area-inset-bottom,0px));padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:1}
.actions .primary{flex:1}
.subrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.inp.sub{padding:8px 10px;font-size:15px}
.x{border:0;background:none;color:var(--muted);font-size:22px;width:34px;height:34px;border-radius:10px;flex:0 0 auto}
.listrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.listrow .inp{flex:1}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emojis button{border:1px solid transparent;background:var(--bg);border-radius:10px;font-size:20px;padding:6px 0}
.emojis button[aria-pressed="true"]{border-color:var(--ink)}
.note-body{flex:1;min-height:200px;border:0;background:transparent;resize:none;font-size:16px;line-height:1.6;padding:4px 2px;outline:none;width:100%}
.note-title{border:0;background:transparent;font-family:var(--display);font-weight:700;font-size:24px;padding:4px 2px;outline:none;width:100%}
.saved{font-size:12px;color:var(--muted)}

/* habits */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.htop{display:flex;align-items:center;gap:12px}
.hemo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 18%,var(--surface));flex:0 0 auto}
.hname{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.hname b{display:block;font-weight:600;overflow-wrap:anywhere}
.hname span{font-size:13px;color:var(--muted)}
.hbig{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--c);background:transparent;display:grid;place-items:center;flex:0 0 auto}
.hbig svg{width:22px;height:22px;stroke:var(--c)}
.hbig.on{background:var(--c)}
.hbig.on svg{stroke:var(--surface)}
.hbig.off{opacity:.35}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;text-align:center}
.week7 small{font-size:11px;color:var(--muted)}
.hd{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:transparent;margin:3px auto 0;display:block;padding:0}
.hd.on{background:var(--c)}
.hd.na{border-style:dashed;opacity:.35}
.hd.fut{opacity:.2;pointer-events:none}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:8px}
.heat i{width:100%;aspect-ratio:1;border-radius:4px;background:var(--sunken)}
.heat i.on{background:var(--c)}
.heat i.miss{background:color-mix(in srgb,var(--danger) 25%,var(--sunken))}
.heat i.none{background:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700}
.stat span{font-size:12px;color:var(--muted)}
.stats.two{grid-template-columns:repeat(2,1fr)}

/* notes */
.ncard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.ncard b{display:block;font-weight:600;overflow-wrap:anywhere}
.ncard p{margin:4px 0 0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ncard .small{margin-top:6px}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;font-size:22px;line-height:1.1;min-width:58px}
.moods button small{font-size:11px;color:var(--muted)}
.moods button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}

/* money */
.bigamt{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.cat{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat .progress{grid-column:2 / 4}
.txn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.txn:first-child{border-top:0}
.txn .em{font-size:20px;width:28px;text-align:center}
.txn .mid{flex:1;min-width:0}
.txn .mid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn .amt{font-weight:600}
.txn .amt.in{color:var(--good)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}

/* more */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:112px}
.mi .e{font-size:26px}
.mi b{font-weight:700;font-family:var(--display);font-size:17px}
.mi span{font-size:13px;color:var(--muted)}
.back{border:0;background:var(--sunken);border-radius:12px;padding:8px 14px;font-weight:600;font-size:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow > div{min-width:0}
.setrow b{display:block;font-weight:600}
.setrow span{font-size:13px;color:var(--muted)}
.setrow select{max-width:48%}

/* search */
.sres{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.sres button{border:0;background:transparent;text-align:left;padding:10px 8px;border-radius:10px}
.sres button:active,.sres button:hover{background:var(--sunken)}
.sres b{display:block;font-weight:500}
.sres span{font-size:13px;color:var(--muted)}
.sgroup{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 8px 2px}

.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;font-size:14px;z-index:20;max-width:min(92vw,480px);display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);animation:toastIn .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}}
.toast-act{border:0;background:transparent;color:var(--sun);font-weight:700;padding:4px 6px;border-radius:8px;flex:0 0 auto}
body.noqa .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.updbar{position:fixed;left:0;right:0;margin:0 auto;width:max-content;top:calc(10px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;font-size:14px;z-index:21;max-width:min(92vw,480px);display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);animation:toastIn .22s cubic-bezier(.2,.9,.3,1.2)}
.loading{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- polish ---------- */
kbd{font:600 11px/1 var(--body);background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;color:var(--muted)}
button{transition:background-color .15s,color .15s,border-color .15s,transform .1s}
button:active{transform:scale(.97)}
.day:active,.mc:active,.task button:active,.tbody:active{transform:none}
.cards.grid{display:grid;gap:10px}
.side{display:none}
.pgrid{display:flex;flex-direction:column}
.pcal{order:-1}
@media (hover:hover){
  .task:hover{background:color-mix(in srgb,var(--sunken) 55%,var(--surface))}
  .ncard:hover,.mi:hover,.hcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
  .chip:hover,.jump:hover,.hbtn:hover{border-color:var(--muted)}
  .mc:not(.sel):hover,.day:not(.sel):hover{background:var(--sunken)}
  .btn.primary:hover,.qa .add:hover{filter:brightness(1.07)}
  .txn:hover{background:var(--sunken)}
  .tl:hover .grip{color:var(--ink)}
}

/* ---------- laptop / desktop layout ---------- */
@media (min-width:1000px){
  body.desk .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:240px;padding:calc(22px + env(safe-area-inset-top,0px)) 14px 18px;border-right:1px solid var(--line);background:var(--surface);z-index:6;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px}
  .brand img{border-radius:10px}
  .brand b{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.01em}
  .side-search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 10px;color:var(--muted);font-size:14px;margin-bottom:10px}
  .side-search > span:not(.ico){flex:1;text-align:left}
  .side-search .ico svg{width:18px;height:18px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:12px;padding:10px 10px;font-weight:600;font-size:15px;color:var(--muted);text-align:left}
  .side-nav button > span:not(.ico){flex:1}
  .side-nav button kbd{opacity:0;transition:opacity .15s}
  .side-nav button:hover{background:var(--sunken);color:var(--ink)}
  .side-nav button:hover kbd{opacity:1}
  .side-nav button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 8px}
  .side-foot .sync{justify-content:flex-start;padding:6px 0;font-size:13px}
  .side-foot p{margin:0;line-height:2}
  body.desk .wrap{max-width:none;margin:0 0 0 240px;padding:34px 48px 150px}
  body.desk.noqa .wrap{padding-bottom:60px}
  body.desk .top,body.desk main{max-width:1180px;margin-left:auto;margin-right:auto}
  body.desk .hact{display:none}
  body.desk .date-big{font-size:48px}
  body.desk .nav{display:none}
  body.desk.noqa .dock{display:none}
  body.desk .dock{left:240px;padding-bottom:18px}
  body.desk .qa{max-width:760px}
  body.desk .toast{left:240px;bottom:110px}
  body.desk .updbar{left:240px}
  body.desk.noqa .toast{bottom:32px}
  body.desk .pgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:36px;align-items:start}
  body.desk .pcal{order:0;position:sticky;top:24px}
  body.desk .plist > .tabs{margin-top:18px}
  body.desk .cards.grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  body.desk .cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}
  body.desk .menu{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  body.desk .stats.two{grid-template-columns:repeat(3,1fr)}
  body.desk .narrow{max-width:760px}
  body.desk .btnrow .btn.wide{flex:0 1 auto;min-width:220px}
  body.desk .sheet{max-width:600px}
  body.desk .sheet.full{max-width:820px}
  body.desk .mc{min-height:44px}
  body.desk .tl{--hour:64px}
}

.keys{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto;max-width:55%}
.keys kbd{font-size:13px;padding:4px 8px;min-width:28px;text-align:center;color:var(--ink)}
.keys .plus{font-size:12px;color:var(--muted)}
.side-guide{border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;font-weight:600;color:var(--muted);text-align:left}
.side-guide kbd{margin-left:auto}
.side-guide:hover{color:var(--ink)}

/* ---------- links ---------- */
.ltools{display:flex;gap:8px;align-items:center;margin-top:16px}
.ltools .inp{flex:1;min-width:0}
.lchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px -18px 0;padding:2px 18px 4px}
.lchips::-webkit-scrollbar{display:none}
.lchips .chip{white-space:nowrap;flex:0 0 auto}
.lsort{display:flex;align-items:center;gap:10px;margin-top:12px}
.lsort .linkbtn{margin-left:auto}
.lsecs{display:grid;gap:14px;margin-top:18px}
.lsec{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.lhead{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 10px}
.lhbtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px;border-radius:12px;text-align:left}
.lhbtn b{font-family:var(--display);font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lhbtn .n{color:var(--muted);font-size:14px}
.chev{margin-left:auto;color:var(--muted);font-size:20px;transform:rotate(90deg);transition:transform .2s}
.shut .chev{transform:none}
.lsec.quick .lhead{padding:12px 14px 4px}
.lsec.quick .lhead b{font-family:var(--display);font-size:18px}
.lemo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--lc) 18%,var(--surface));flex:0 0 auto}
.openall{white-space:nowrap}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px 4px;padding:4px 8px 12px}
.lsec.shut .lgrid{display:none}
.lsecs.searching .lsec.shut .lgrid{display:grid}
.lt{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--ink);padding:10px 4px 8px;border-radius:16px;position:relative;min-width:0;-webkit-touch-callout:none}
.lt:focus-visible{outline-offset:-2px}
.lt:active .lg{transform:scale(.92)}
.lg{--ls:56px;width:var(--ls);height:var(--ls);border-radius:calc(var(--ls) * .28);display:grid;place-items:center;position:relative;overflow:hidden;flex:0 0 auto;background:color-mix(in srgb,var(--lc) 16%,var(--surface));transition:transform .15s,box-shadow .2s;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--lc) 22%,transparent)}
.lgl{font-family:var(--display);font-weight:800;font-size:calc(var(--ls) * .42);color:var(--lc);transition:opacity .2s}
.lg img{position:absolute;inset:0;margin:auto;width:62%;height:62%;object-fit:contain;opacity:0;transition:opacity .25s}
.lg.has{background:#fff;box-shadow:inset 0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.06)}
.lg.has img{opacity:1}
.lg.has .lgl{opacity:0}
.ln{font-size:12.5px;font-weight:500;text-align:center;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;max-width:100%}
.ledit{position:absolute;top:4px;right:calc(50% - 38px);width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12px;display:none;place-items:center;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.12)}
body.editing .ledit{display:grid}
body.editing .lt .lg{animation:wig .28s ease-in-out infinite alternate}
body.editing .lt:nth-child(2n) .lg{animation-delay:-.14s}
@keyframes wig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@media (hover:hover){.lt:hover{background:var(--sunken)}.lt:hover .lg{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--line),0 6px 14px rgba(0,0,0,.10)}.lt:hover .ledit{display:grid}.lhbtn:hover{background:var(--sunken)}}
.lprev{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:12px;margin-top:10px;min-height:72px}
.lprev .mid,.oborow .mid{display:flex;flex-direction:column;min-width:0}
.lprev .mid b,.oborow .mid b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emsel{max-width:70px;font-size:18px;padding:8px}
.catedit{padding-bottom:12px;border-bottom:1px solid var(--line)}
.obo{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.oborow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.oborow .mid{flex:1}
.oborow .obost{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.oborow.done{opacity:.55}
.oborow.done .obost{color:var(--muted)}
@media (min-width:1000px){
  body.desk .lgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));padding:6px 12px 14px}
  body.desk .lg{--ls:62px}
  body.desk .ltools{max-width:760px}
  body.desk .lchips{margin-left:0;margin-right:0;padding-left:0}
}
.lsort .seg button{white-space:nowrap;padding:6px 11px}
.lsort{flex-wrap:wrap}

/* ---------- home dashboard ---------- */
.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.wdg{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 16px 16px;min-width:0}
.wdg.full{grid-column:span 2}
.wdg.compact{padding:12px 14px}
.wdh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wdh b{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wdg.compact .wdh{margin-bottom:6px}
.wdg.compact .wdh b{font-size:12.5px;color:var(--muted)}
.wdi{font-size:16px;width:24px;text-align:center;flex:0 0 auto;display:inline-flex;justify-content:center}
.wdi .ico svg{width:20px;height:20px}
.wdgo{border:0;background:var(--sunken);width:28px;height:28px;border-radius:9px;font-size:18px;line-height:1;color:var(--muted);flex:0 0 auto}
.wstat{display:flex;flex-direction:column;border:0;background:none;padding:0;text-align:left;width:100%;min-width:0}
.wstat b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wstat span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nlist{display:flex;flex-direction:column;gap:2px}
.nrow{display:flex;align-items:center;gap:12px;border:0;background:none;padding:9px 6px;border-radius:12px;text-align:left;text-decoration:none;color:var(--ink);width:100%}
.nrow:hover{background:var(--sunken)}
.ntime{font-weight:700;font-size:13px;color:var(--accent);min-width:72px}
.ntitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmini{display:flex;gap:14px;flex-wrap:wrap}
.hm{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;text-align:center;font-size:12px}
.hm span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.glist{display:flex;flex-direction:column;gap:8px}
.grow{border:0;background:none;padding:6px 0;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.wlinks{padding:0;grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.wlinks .lg{--ls:48px}
.dashrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.dashrow:first-child{border-top:0}
.dashrow b{flex:1;min-width:110px}
.dashrow.off b{color:var(--muted)}
.dashrow .seg button{padding:5px 10px}
.arrows{display:flex}
.x:disabled{opacity:.25}

/* ---------- smart quick add hint ---------- */
.qahint{max-width:720px;margin:0 auto 6px;display:flex;gap:6px;flex-wrap:wrap;padding:0 4px}
.qahint span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.06);animation:fade .15s}
body.noqa .qahint{display:none}

/* ---------- focus ---------- */
.fring{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:8px auto 4px}
.fring svg{width:100%;height:100%}
.ftrack{fill:none;stroke:var(--sunken);stroke-width:14}
.fprog{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.fring.brk .fprog{stroke:var(--sun)}
.fcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 40px}
.ftime{font-family:var(--display);font-size:clamp(44px,13vw,60px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.flabel{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fctrls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.fctrls .btn{flex:1 1 auto}
.fpill{position:fixed;right:14px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 14px 9px 12px;box-shadow:var(--shadow);max-width:60vw;animation:toastIn .2s}
body.noqa .fpill{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.fpill i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.fpill.brk i{background:var(--sun)}
.fpill b{font-variant-numeric:tabular-nums;font-size:14px}
.fpill span{font-size:13px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pulse{50%{opacity:.35}}

/* ---------- lock ---------- */
body.locked .wrap,body.locked .dock,body.locked .side,body.locked .fpill,body.locked .toast,body.locked .updbar,body.locked .scrim:not(.overlock){visibility:hidden}
#lockScreen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));outline:none;animation:fade .15s}
#lockScreen.out{opacity:0;transition:opacity .2s}
#lockScreen h2{font-family:var(--display);font-size:22px;margin:4px 0 0}
.plogo{border-radius:18px;box-shadow:var(--shadow)}
.pdots{display:flex;gap:14px;height:18px;align-items:center}
.pdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);transition:background .1s}
.pdots i.on{background:var(--ink)}
.pdots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pmsg{min-height:20px;font-size:14px;color:var(--danger)}
.pkeys{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;margin:6px 0 8px}
.pkey{width:76px;height:76px;border-radius:50%;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--display);font-size:28px;font-weight:600}
.pkey.fn{background:transparent;box-shadow:none;font-size:24px}
.pkey:active{background:var(--sunken)}
.scrim.overlock{z-index:110}
.pinin{font-size:24px;letter-spacing:.4em;text-align:center}

/* ---------- countdowns, templates ---------- */
.cdcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.cdcard.compact{padding:10px 12px;border-radius:14px}
.cde{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 16%,var(--surface));flex:0 0 auto}
.cdm{flex:1;min-width:0;display:flex;flex-direction:column}
.cdm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdm span{font-size:13px;color:var(--muted)}
.cdn{display:flex;flex-direction:column;align-items:center;min-width:52px}
.cdn b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1;color:var(--c)}
.cdn span{font-size:11px;color:var(--muted)}
.cdchip{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.tplcard .btn{width:100%}

/* ---------- insights ---------- */
.insgrid{display:grid;gap:0}
.chart svg{width:100%;height:130px;display:block;overflow:visible}
.chart rect{fill:var(--accent);opacity:.85}
.chart rect.hi{fill:var(--sun);opacity:1}
.chart rect:hover{opacity:1}
.chart text{font-size:9px;fill:var(--muted);font-family:var(--body)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart.line path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.chart.line circle{fill:var(--surface);stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.hbar .progress{grid-column:1/3}
.hbar .hv{font-weight:600}

/* ---------- shared lists ---------- */
.avs{display:flex;align-items:center;gap:4px;margin-top:10px;flex-wrap:wrap}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--c);border:2px solid var(--surface);margin-right:-6px}
.avs .small{margin-left:12px}
.codebox{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:.08em;text-align:center;background:var(--bg);border:2px dashed var(--line);border-radius:18px;padding:18px;user-select:all}
.codein{font-family:var(--display);font-size:24px;letter-spacing:.12em;text-align:center;text-transform:uppercase}

/* ---------- google calendar ---------- */
.evrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.evrow:first-child{border-top:0}
.evrow .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.evrow .mid b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evbar{width:4px;align-self:stretch;border-radius:4px;background:#4285F4}
.blk.ev{--c:#4285F4;background:repeating-linear-gradient(135deg,color-mix(in srgb,#4285F4 14%,var(--surface)) 0 8px,color-mix(in srgb,#4285F4 9%,var(--surface)) 8px 16px);text-decoration:none;color:var(--ink);padding-right:8px}
.evchip{text-decoration:none;color:var(--ink);border-color:#4285F4}
.mdots b.evdot,.mdots .evdot{background:transparent!important;box-shadow:inset 0 0 0 1.5px #4285F4}
.gcchip{border-color:#4285F4}
.small.due{color:var(--sun);font-weight:600}
.sgroup:first-child{margin-top:12px}

@media (min-width:1000px){
  body.desk .dash{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  body.desk .insgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
  body.desk .fpill{right:28px;bottom:110px}
  body.desk.noqa .fpill{bottom:28px}
}

};

/* ================= helpers ================= */
const clone=o=>JSON.parse(JSON.stringify(o));
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const el=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==="class")el.className=v;else if(k==="text")el.textContent=v;else if(k==="style")el.style.cssText=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?"":v);}for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}return el;}
function ico(n){const s=document.createElement("span");s.className="ico";s.innerHTML=ICONS[n];return s;}
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const todayKey=()=>key(new Date());
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;};
function relLabel(k){const t=new Date();if(k===key(t))return"Today";if(k===key(addDays(t,1)))return"Tomorrow";if(k===key(addDays(t,-1)))return"Yesterday";return fromKey(k).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});}
function relLow(k){const l=relLabel(k);return /^(Today|Tomorrow|Yesterday)$/.test(l)?l.toLowerCase():l;}
function longDate(k){return fromKey(k).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function fmtTime(t){if(!t)return"";const [H,M]=t.split(":").map(Number);const d=new Date();d.setHours(H,M,0,0);return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
const minToHHMM=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
function lsGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:v;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function debounce(fn,ms){let t=null,args=[];const f=(...a)=>{args=a;clearTimeout(t);t=setTimeout(()=>{t=null;fn(...args);},ms);};f.flush=()=>{if(t){clearTimeout(t);t=null;fn(...args);}};f.cancel=()=>{clearTimeout(t);t=null;};return f;}
let toastTimer=0;
function toast(msg,action){const old=$(".toast");if(old)old.remove();clearTimeout(toastTimer);
  const t=h("div",{class:"toast",role:"status"},h("span",{text:msg}),action?h("button",{class:"toast-act",text:action.label,onclick:()=>{t.remove();action.fn();}}):null);
  document.body.append(t);toastTimer=setTimeout(()=>t.remove(),action?5500:2800);}
const snap=(c,id)=>D[c].has(id)?clone(D[c].get(id)):null;
function undoable(msg,changes){toast(msg,{label:"Undo",fn:()=>{changes.forEach(([c,prev,id])=>prev?Store.put(c,prev):Store.del(c,id));}});}
function twoTap(btn,label,fn){let armed=false,timer;btn.addEventListener("click",()=>{if(armed){clearTimeout(timer);armed=false;fn();return;}armed=true;const orig=btn.textContent;btn.textContent=label;timer=setTimeout(()=>{armed=false;btn.textContent=orig;},3000);});}
const numFmt=new Intl.NumberFormat(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtCache={};
function money(n){
  n=Number(n)||0;
  if(SET.currencySymbol){const neg=n<0?"-":"";return neg+SET.currencySymbol+(/^[A-Za-z]{2,}$/.test(SET.currencySymbol)?" ":"")+numFmt.format(Math.abs(n));}
  const c=SET.currency;if(!c)return numFmt.format(n);
  try{const f=fmtCache[c]||(fmtCache[c]=(()=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c,currencyDisplay:"narrowSymbol"});}catch(e){return new Intl.NumberFormat(undefined,{style:"currency",currency:c});}})());return f.format(n);}
  catch(e){return c+" "+numFmt.format(n);}
}
function download(blob,name){const u=URL.createObjectURL(blob);const a=h("a",{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
const scripts={};
function loadScript(src){return scripts[src]||(scripts[src]=new Promise((res,rej)=>{const s=h("script",{src});s.onload=res;s.onerror=()=>{delete scripts[src];rej(new Error("Couldn't load a component. Check your connection."));};document.head.append(s);}));}
function seg(options,value,onPick){const wrap=h("div",{class:"seg",role:"group"});options.forEach(([v,l])=>wrap.append(h("button",{type:"button","aria-pressed":String(v===value),text:l,onclick:()=>{wrap.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed","false"));wrap.querySelector(`[data-v="${v}"]`).setAttribute("aria-pressed","true");onPick(v);},"data-v":v})));return wrap;}
function chips(options,value,onPick){const row=h("div",{class:"row"});const bs=options.map(([v,l,dot])=>h("button",{type:"button",class:"chip","aria-pressed":String(v===value),onclick:()=>{bs.forEach(x=>x.setAttribute("aria-pressed",String(x===b(v))));onPick(v);},"data-v":v},dot?h("span",{class:"ldot",style:"background:"+dot}):null,l));const b=v=>bs.find(x=>x.dataset.v===String(v));row.append(...bs);return row;}
function bar(pct,over){return h("div",{class:"progress"+(over?" over":""),"aria-hidden":"true"},h("b",{style:"width:"+Math.max(0,Math.min(100,Math.round(pct*100)))+"%"}));}

/* ================= state ================= */
const D={};COLS.forEach(c=>D[c]=new Map());
let SET=clone(SET_DEFAULT);
const MQ=window.matchMedia("(min-width: 1000px)");
const UI={desktop:MQ.matches,ready:false,tab:"home",sharedList:null,insPeriod:"30",planView:"day",sel:todayKey(),cal:lsGet("planner.cal",MQ.matches?"month":"week"),month:todayKey().slice(0,7),stripScroll:null,notesSeg:"notes",moneyMonth:todayKey().slice(0,7),page:null,shopList:"groceries",reviewWeek:0,expanded:new Set(),linkCat:"",linkQuery:"",linkEdit:false};
const vals=c=>[...D[c].values()];
const listById=id=>SET.lists.find(l=>l.id===id);
const catById=id=>SET.categories.find(c=>c.id===id)||{id,name:"Other",emoji:"📦"};

/* ================= sheets ================= */
function openSheet(content,opts){
  opts=opts||{};
  const scrim=h("div",{class:"scrim"+(opts.cls?" "+opts.cls:""),onclick:e=>{if(e.target===scrim)close();}});
  const sheet=h("div",{class:"sheet"+(opts.full?" full":""),role:"dialog","aria-modal":"true"},content);
  scrim.append(sheet);document.body.append(scrim);document.body.style.overflow="hidden";
  let closed=false;
  function close(){if(closed)return;closed=true;if(opts.onClose)opts.onClose();scrim.remove();document.removeEventListener("keydown",esc);if(!$(".scrim"))document.body.style.overflow="";}
  function esc(e){if(e.key==="Escape"&&scrim===[...document.querySelectorAll(".scrim")].pop())close();}
  document.addEventListener("keydown",esc);
  return close;
}

/* ================= sync store ================= */
const CFG=window.PLANNER_FIREBASE_CONFIG||{};
const WANT_FB=!!(CFG.apiKey&&!/PASTE/.test(CFG.apiKey));
let fbAuth=null,fbDb=null,fbFailed=false;
const FB="https://www.gstatic.com/firebasejs/10.12.2/firebase-";
async function loadFirebase(){
  await loadScript(FB+"app-compat.js");
  await Promise.all([loadScript(FB+"auth-compat.js"),loadScript(FB+"firestore-compat.js")]);
  firebase.initializeApp(CFG);fbDb=firebase.firestore();fbDb.enablePersistence({synchronizeTabs:true}).catch(()=>{});fbAuth=firebase.auth();
}
function clean(x){const o=JSON.parse(JSON.stringify(x));delete o.id;return o;}

const Store={
  mode:"local",user:null,base:null,unsubs:[],
  async init(){
    if(WANT_FB){try{await loadFirebase();}catch(e){console.error(e);fbFailed=true;}}
    if(!fbAuth){this.goLocal();if(fbFailed)toast("Couldn't reach sync right now. Showing what's saved on this device.");return;}
    let first=true;
    fbAuth.onAuthStateChanged(u=>{
      if(u)this.goCloud(u);
      else{this.goLocal();if(first&&lsGet("planner.skipSync","0")!=="1")setTimeout(openAccount,400);}
      first=false;
    });
  },
  stop(){this.unsubs.forEach(f=>{try{f();}catch(e){}});this.unsubs=[];if(typeof sharedStop==="function")sharedStop();},
  reset(){COLS.forEach(c=>D[c]=new Map());SET=clone(SET_DEFAULT);},
  readLocal(){
    let d=null;try{d=JSON.parse(localStorage.getItem(LS2)||"null");}catch(e){}
    if(!d){try{const v1=JSON.parse(localStorage.getItem(LS1)||"null");if(v1)d={tasks:v1.tasks||[],settings:v1.lists?{lists:v1.lists}:{}};}catch(e){}}
    return d;
  },
  goLocal(){
    this.stop();this.mode="local";this.user=null;this.reset();syncErr=false;
    const d=this.readLocal();
    if(d){COLS.forEach(c=>(d[c]||[]).forEach(x=>x&&x.id&&D[c].set(x.id,x)));if(d.settings)SET=Object.assign(clone(SET_DEFAULT),d.settings);if(!Array.isArray(SET.linkCats)||!SET.linkCats.length)SET.linkCats=clone(SET_DEFAULT.linkCats);}
    UI.ready=true;updateSync();render();
  },
  _persist:debounce(()=>{
    try{const out={settings:SET};COLS.forEach(c=>out[c]=vals(c));localStorage.setItem(LS2,JSON.stringify(out));localStorage.removeItem(LS1);}
    catch(e){toast("Couldn't save on this device. Its storage may be full.");}
  },250),
  async goCloud(u){
    this.stop();this.mode="cloud";this.user=u;this.reset();UI.ready=false;syncErr=false;updateSync();render();
    u.reload().then(()=>{updateSync();render();}).catch(()=>{}); // picks up a name changed on another device
    this.base=fbDb.collection("users").doc(u.uid);
    await this.migrateLocal();
    COLS.forEach(c=>{
      this.unsubs.push(this.base.collection(c).onSnapshot(snap=>{
        snap.docChanges().forEach(ch=>{if(ch.type==="removed")D[c].delete(ch.doc.id);else D[c].set(ch.doc.id,Object.assign({id:ch.doc.id},ch.doc.data()));});
        if(c==="tasks"&&!UI.ready){UI.ready=true;updateSync();}
        render();
      },err=>{console.error(err);UI.ready=true;updateSync("error");render();}));
    });
    try{sharedStart();}catch(e){console.error(e);}
    this.unsubs.push(this.base.onSnapshot(s=>{
      const d=s.exists?s.data():{};SET=Object.assign(clone(SET_DEFAULT),d);
      if(!Array.isArray(SET.lists)||!SET.lists.length)SET.lists=clone(DEFAULT_LISTS);
      if(!Array.isArray(SET.categories)||!SET.categories.length)SET.categories=clone(DEFAULT_CATS);
      if(!Array.isArray(SET.shopLists)||!SET.shopLists.length)SET.shopLists=clone(SET_DEFAULT.shopLists);
      if(!Array.isArray(SET.linkCats)||!SET.linkCats.length)SET.linkCats=clone(SET_DEFAULT.linkCats);
      render();
    },()=>{}));
  },
  async migrateLocal(){
    const d=this.readLocal();if(!d)return;
    const items=[];COLS.forEach(c=>(d[c]||[]).forEach(x=>x&&x.id&&items.push([c,x])));
    try{
      if(items.length)await this.writeMany(items);
      if(d.settings&&Object.keys(d.settings).length){const snap=await this.base.get().catch(()=>null);if(!(snap&&snap.exists))await this.base.set(clean(d.settings),{merge:true});}
      localStorage.removeItem(LS2);localStorage.removeItem(LS1);
      if(items.length)toast("Moved "+plural(items.length,"item")+" from this device into your account");
    }catch(e){console.error(e);}
  },
  async writeMany(items){for(let i=0;i<items.length;i+=400){const b=fbDb.batch();items.slice(i,i+400).forEach(([c,x])=>b.set(this.base.collection(c).doc(x.id),clean(x)));await b.commit();}},
  fail(e){console.error(e);toast(e&&e.code==="permission-denied"?"Sync was refused. Check the database rules in Firebase (setup guide, step 1).":"Couldn't sync that change yet. It will retry when you're back online.");},
  put(c,x){D[c].set(x.id,x);render();if(this.mode==="cloud")this.base.collection(c).doc(x.id).set(clean(x)).catch(e=>this.fail(e));else this._persist();},
  del(c,id){D[c].delete(id);render();if(this.mode==="cloud")this.base.collection(c).doc(id).delete().catch(e=>this.fail(e));else this._persist();},
  settings(patch){Object.assign(SET,patch);render();if(this.mode==="cloud")this.base.set(clean(patch),{mergeFields:Object.keys(patch)}).catch(e=>this.fail(e));else this._persist();},
  async importAll(data){
    const items=[];COLS.forEach(c=>(Array.isArray(data[c])?data[c]:[]).forEach(x=>{if(x&&x.id){D[c].set(x.id,x);items.push([c,x]);}}));
    const st=data.settings&&typeof data.settings==="object"?data.settings:null;
    if(st)Object.assign(SET,st);
    render();
    if(this.mode==="cloud"){await this.writeMany(items);if(st)await this.base.set(clean(st),{merge:true});}else this._persist();
    return items.length;
  }
};

let syncErr=false;
function syncState(){
  if(Store.mode==="cloud"){
    if(syncErr)return{mode:"error",label:"Sync problem",long:"Sync problem. Close and reopen the app to try again."};
    if(!navigator.onLine)return{mode:"offline",label:"Offline",long:"Offline. Your changes are saved and will sync when you reconnect."};
    return UI.ready?{mode:"cloud",label:"Synced",long:"Synced across your devices"}:{mode:"cloud",label:"Syncing…",long:"Syncing…"};}
  return{mode:"local",label:fbAuth?"Sign in to sync":fbFailed?"Offline":"This device only",long:""};
}
function updateSync(forced){
  if(forced==="error")syncErr=true;
  const st=syncState(),u=Store.user,me=u&&meInfo();
  const hact=$(".hact");if(hact)hact.classList.toggle("user",!!u);
  document.querySelectorAll(".sync").forEach(el=>{
    el.className="sync "+st.mode+(u?" user":"");
    const av=el.querySelector(".pav");if(av){av.textContent=me?me.name.charAt(0).toUpperCase():"";av.style.setProperty("--c",u?colorFor(u.uid):"");}
    el.querySelector("span").textContent=u&&el.id!=="sync"?me.name+" · "+st.label:st.label;
    el.setAttribute("aria-label",u?"Your profile: "+st.label:st.label);
  });
}
window.addEventListener("online",()=>{syncErr=false;updateSync();render();});window.addEventListener("offline",()=>{updateSync();render();});

function authMsg(e){const c=(e&&e.code)||"";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return"That email and password don't match. Check them, or create an account.";
  if(c.includes("email-already-in-use"))return"There's already an account with that email. Sign in instead.";
  if(c.includes("weak-password")||c.includes("password-does-not-meet-requirements"))return"Use a password with at least 8 characters.";

async function deleteAccount(pw){
  const u=Store.user,uid=u.uid,FV=firebase.firestore.FieldValue;
  await reauth(pw); // proves it's you before anything is touched
  const lists=[...Shared.lists.values()].map(L=>({L,items:itemsOf(L.id)}));
  const base=fbDb.collection("users").doc(uid);
  Store.stop();
  for(const {L,items} of lists){const ref=fbDb.collection("shared").doc(L.id);
    if(L.owner===uid){for(const it of items)await ref.collection("items").doc(it.id).delete();await ref.delete();}

    for(let i=0;i<refs.length;i+=400){const b=fbDb.batch();refs.slice(i,i+400).forEach(r=>b.delete(r));await b.commit();}}

  try{await u.delete();}catch(e){e.stage="login";throw e;}
  try{Object.keys(localStorage).filter(k=>k.startsWith("planner.")).forEach(k=>localStorage.removeItem(k));}catch(e){}
  try{sessionStorage.setItem("planner.deleted","1");}catch(e){}
  try{await fbDb.terminate();await fbDb.clearPersistence();}catch(e){}

      h("button",{type:"button",class:"x","aria-label":"Remove "+nm,text:"×",onclick:()=>{pick.splice(i,1);draw();}}))));});
    box.append(h("div",{class:"dashrow"},h("span",{class:"wdi"},ico("more")),h("b",{text:"More"}),h("span",{class:"small muted",text:"Always last"})));
    const rest=navPinnable().filter(c=>!pick.includes(c[0])),full=L.max&&pick.length>=L.max;
    if(rest.length)box.append(h("div",{class:"field"},h("span",{class:"lbl",text:L.max?(pick.length<L.max?"Add "+(L.max-pick.length)+" more":"Remove one to add another"):"Add to the sidebar"}),
      h("div",{class:"row"},rest.map(([id,nm])=>h("button",{type:"button",class:"chip",disabled:!!full,text:"+ "+nm,onclick:()=>{pick.push(id);draw();}})))));
    save.disabled=!!L.max&&pick.length!==L.max;};
  const save=h("button",{class:"btn primary",text:"Save"}),cancel=h("button",{class:"btn ghost",text:"Cancel"});
  const close=openSheet([h("h3",{text:which==="phone"?"Bottom bar":"Sidebar"}),
    h("p",{class:"small muted",style:"margin:0 0 6px",text:(which==="phone"?"Pick the 4 pages you use most, in the order you want them.":"Pick the pages to show in the laptop sidebar, in your order. Number keys 1 to 9 follow this order.")+" Everything else stays one tap away in More."+(Store.user?" Saved to your account.":"")}),
    preview,box,h("div",{class:"actions"},cancel,save)]);
  draw();cancel.onclick=close;save.onclick=()=>{Store.settings({[L.key]:pick});buildNav();close();render();};
}

/* ================= main ================= */
function setHeader(big,sub){$("#bigDate").textContent=big;$("#subDate").textContent=sub||"";}
const TABS=[["home","Home"],["plan","Plan"],["habits","Habits"],["notes","Notes"],["money","Money"],["links","Links"],["more","More"]];
function goTab(t){if(t==="more"&&UI.tab==="more"){UI.page=null;UI.sharedList=null;}if(t!=="links")UI.linkEdit=false;UI.tab=t;if(t!=="more")UI.page=null;UI.sharedList=t==="more"?UI.sharedList:null;render();window.scrollTo(0,0);}
let rafId=0;
function render(){if(rafId)return;rafId=requestAnimationFrame(()=>{rafId=0;draw();});}
function draw(){
  buildIndex();
  const tab=UI.tab,qaOn=tab==="plan"||tab==="links"||(tab==="more"&&(UI.page==="shopping"||(UI.page==="shared"&&!!UI.sharedList&&Shared.lists.has(UI.sharedList))));
  if(tab!=="links")document.body.classList.remove("editing");
  const ae=document.activeElement,refocus=ae&&ae.id&&$("#main").contains(ae)?{id:ae.id,a:ae.selectionStart,b:ae.selectionEnd}:null;
  document.body.classList.toggle("noqa",!qaOn);
  buildNav(true);
  const cur=tab==="more"&&UI.page?UI.page:tab;
  [["#nav","phone"],["#sideNav","desk"]].forEach(([sel,which])=>{const ids=navFull(which),on=ids.includes(cur)?cur:"more";
    document.querySelectorAll(sel+" button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===on?"page":"false"));});
  document.body.classList.toggle("desk",UI.desktop);
  const main=$("#main");main.textContent="";
  if(!UI.ready){setHeader("Planner","");main.append(h("div",{class:"loading",text:"Loading your planner…"}));return;}
  ({home:renderHome,plan:renderPlan,habits:renderHabits,notes:renderNotes,money:renderMoney,links:renderLinks,more:renderMore})[tab](main);
  processSubs();updateQaHint();
  if(refocus){const el=document.getElementById(refocus.id);if(el){el.focus({preventScroll:true});try{el.setSelectionRange(refocus.a,refocus.b);}catch(e){}}}
  const qi=$("#qaInput");
  qi.placeholder=tab==="plan"?(UI.planView==="lists"?"Add a task (no date)":"Add a task for "+(UI.planView==="upcoming"?"today":relLow(UI.sel))):tab==="links"?"Paste a link to save it":UI.page==="shared"&&Shared.lists.get(UI.sharedList)&&Shared.lists.get(UI.sharedList).kind==="todo"?"Add a to-do":"Add an item, e.g. 2 kg rice";
  if(tab==="plan")qi.placeholder="Try: Dentist tomorrow 3pm #personal !!";
  scheduleNotify();
  if(pending||sharedText||joinCode)setTimeout(runPending,0);
}

/* quick add */
$("#qaForm").addEventListener("submit",e=>{e.preventDefault();const qi=$("#qaInput");const v=qi.value.trim();if(!v)return;
  if(UI.tab==="links"){if(quickAddLink(v))qi.value="";return;}
  if(UI.tab==="more"&&UI.page==="shared"){addSharedItem(v);qi.value="";updateQaHint();return;}
  if(UI.tab==="more"&&UI.page==="shopping"){const p=parseItem(v);Store.put("shop",{id:uid(),listId:UI.shopList,name:p.name,qty:p.qty,done:false,createdAt:Date.now()});}
  else{const p=parseQuick(v);const defDate=UI.planView==="lists"?null:(UI.planView==="upcoming"?todayKey():UI.sel);
    const t=newTask({title:p.title||v,date:p.date!==undefined?p.date:defDate});["time","duration","listId","priority","repeat","remind"].forEach(k=>{if(p[k]!==undefined)t[k]=p[k];});
    Store.put("tasks",t);const bits=parseChips(p);
    toast("Added"+(t.date?" to "+relLabel(t.date):"")+(t.time?" at "+fmtTime(t.time):"")+(bits.length>2?", with "+plural(bits.length-(t.date?1:0)-(t.time?1:0),"detail"):""),{label:"Edit",fn:()=>openTask(D.tasks.get(t.id))});}
  qi.value="";updateQaHint();});
function updateQaHint(){const el=$("#qaHint");if(!el)return;const v=$("#qaInput").value.trim();el.textContent="";
  if(UI.tab!=="plan"||!v){el.hidden=true;return;}const c=parseChips(parseQuick(v));el.hidden=!c.length;c.forEach(x=>el.append(h("span",{text:x})));}
$("#qaInput").addEventListener("input",updateQaHint);
$("#qaMore").addEventListener("click",()=>{const qi=$("#qaInput");const v=qi.value.trim();
  if(UI.tab==="more"&&UI.page==="shopping"){$("#qaForm").requestSubmit();return;}
  if(UI.tab==="links"){qi.value="";openLink(null,v?{url:normalizeUrl(v)||v}:null);return;}
  const ti=openTask(null);if(v){ti.value=v;qi.value="";}});

/* nav */
const nav=$("#nav"),sideNav=$("#sideNav");
let navBuilt="";
function buildNav(onlyIfChanged){
  const sig=JSON.stringify([navFull("phone"),navFull("desk")]);if(onlyIfChanged&&sig===navBuilt)return;navBuilt=sig;
  nav.textContent="";navFull("phone").forEach(t=>{const l=navName(t);nav.append(h("button",{"data-tab":t,"aria-label":l,onclick:()=>goNav(t)},navIcon(t),h("span",{text:l})));});
  sideNav.textContent="";navFull("desk").forEach((t,i)=>{sideNav.append(h("button",{"data-tab":t,onclick:()=>goNav(t)},navIcon(t),h("span",{text:navName(t)}),i<9?h("kbd",{text:String(i+1)}):null));});
}
buildNav();
$("#searchBtn").append(ico("search"));$("#searchBtn").addEventListener("click",openSearch);
$("#sideSearch").prepend(ico("search"));$("#sideSearch").addEventListener("click",openSearch);
document.querySelectorAll(".sync").forEach(b=>b.addEventListener("click",openAccount));
MQ.addEventListener("change",()=>{UI.desktop=MQ.matches;render();});
function openGuide(){UI.tab="more";UI.page="guide";render();window.scrollTo(0,0);}
$("#sideGuide").addEventListener("click",openGuide);

/* keyboard shortcuts (laptop) */
function newInSection(){
  const t=UI.tab;
  if(t==="plan")openTask(null);
  else if(t==="habits")openHabit(null);
  else if(t==="notes"){if(UI.notesSeg==="journal")openJournal(todayKey());else openNote(null);}
  else if(t==="money")openExpense(null);
  else if(t==="links")openLink(null);
  else if(t==="more"&&UI.page==="goals")openGoal(null);
  else if(t==="more"&&UI.page==="shopping")$("#qaInput").focus();
  else openTask(null);
}
document.addEventListener("keydown",e=>{
  if(appLocked)return;
  const el=e.target,typing=el&&(/^(input|textarea|select)$/i.test(el.tagName)||el.isContentEditable);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(!$(".scrim"))openSearch();return;}
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){const sc=[...document.querySelectorAll(".scrim")].pop();const p=sc&&sc.querySelector(".btn.primary");if(p){e.preventDefault();p.click();}return;}
  if(typing||e.metaKey||e.ctrlKey||e.altKey||$(".scrim"))return;
  const k=e.key;
  if(k==="/"){e.preventDefault();openSearch();}
  else if(k==="n"||k==="N"){e.preventDefault();newInSection();}
  else if(/^[1-9]$/.test(k)){const id=navFull("desk")[Number(k)-1];if(id)goNav(id);}
  else if(k==="f"||k==="F"){e.preventDefault();openFocus();}
  else if(UI.tab==="plan"&&(k==="t"||k==="T")){UI.stripScroll=null;pickDay(todayKey());}
  else if(UI.tab==="plan"&&(k==="ArrowLeft"||k==="ArrowRight")){e.preventDefault();UI.stripScroll=null;pickDay(key(addDays(fromKey(UI.sel),k==="ArrowLeft"?-1:1)));}
  else if(k==="q"&&!document.body.classList.contains("noqa")){e.preventDefault();$("#qaInput").focus();}
  else if(k==="?"){e.preventDefault();openGuide();}
});

/* home-screen shortcuts & share target */
const params=new URLSearchParams(location.search);
let pending=params.get("a");
let sharedText=[params.get("text"),params.get("url")].filter(Boolean).join("\n");
const sharedTitle=params.get("title");
if(pending||sharedText||sharedTitle)history.replaceState(null,"",location.pathname);
if(sharedTitle&&!sharedText)sharedText=sharedTitle;
let joinCode=(params.get("join")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
if(joinCode)history.replaceState(null,"",location.pathname);
function runPending(){
  if(!UI.ready||$(".scrim")||appLocked)return;
  if(joinCode){if(Store.mode!=="cloud"){if(fbAuth)openAccount();return;}const c=joinCode;joinCode="";UI.tab="more";UI.page="shared";render();openJoin(c);return;}
  if(sharedText){
    const urls=extractUrls(sharedText),rest=sharedText.replace(/https?:\/\/\S+/g,"").trim();
    if(urls.length===1&&rest.length<80){const u=urls[0];const x={id:uid(),url:u,name:(sharedTitle&&sharedTitle.length<60&&!/^https?:/.test(sharedTitle))?sharedTitle:niceName(u),catId:(SET.linkCats[0]||{}).id||"",note:rest.slice(0,200),visits:0,createdAt:Date.now()};
      const txt=sharedText;sharedText="";Store.put("links",x);UI.tab="links";render();
      toast("Saved to Links",{label:"Save as note instead",fn:()=>{Store.del("links",x.id);const n=newNote({title:x.name,body:txt});Store.put("notes",n);UI.tab="notes";UI.notesSeg="notes";render();}});return;}
    const n=newNote({title:sharedTitle&&sharedTitle!==sharedText?sharedTitle:"Saved "+new Date().toLocaleDateString(),body:sharedText});sharedText="";Store.put("notes",n);UI.tab="notes";UI.notesSeg="notes";render();toast("Saved to Notes");openNote(n);return;}
  const a=pending;pending=null;
  if(a==="task"){UI.tab="plan";render();openTask(null);}
  else if(a==="expense"){UI.tab="money";render();openExpense(null);}
  else if(a==="note"){UI.tab="notes";UI.notesSeg="notes";render();openNote(null);}
  else if(a==="journal"){UI.tab="notes";UI.notesSeg="journal";render();openJournal(todayKey());}
}

applyTheme();
if(lockCfg())lockNow();
render();
Store.init();
try{if(sessionStorage.getItem("planner.deleted")){sessionStorage.removeItem("planner.deleted");setTimeout(()=>toast("Your account and its data have been deleted."),300);}}catch(e){}
refreshFocusUI();{const st=focusState();if(st&&!st.paused&&!st.done&&focusRemaining(st)<=0)finishFocus();else scheduleFocusEnd();}
$("#focusPill").addEventListener("click",()=>openFocus());

/* app updates: sw.js installs new versions straight away; offer a one-tap reload into them */
const Updates={reg:null,shown:false,version:""};
function readVersion(){if(!("caches" in window))return;caches.keys().then(ks=>{const v=(ks.find(k=>/^planner-/.test(k))||"").replace(/^planner-/,"");if(v!==Updates.version){Updates.version=v;if(UI.page==="settings")render();}}).catch(()=>{});}
function showUpdateBar(){if(Updates.shown)return;Updates.shown=true;
  document.body.append(h("div",{class:"updbar",role:"status"},h("span",{text:"A new version of Planner is ready."}),h("button",{class:"toast-act",text:"Update now",onclick:()=>location.reload()})));}
function checkForUpdate(){return Updates.reg?Updates.reg.update():Promise.reject(new Error("no service worker"));}
async function checkForUpdateNow(btn){
  btn.disabled=true;
  try{await checkForUpdate();const r=Updates.reg;if(!r.installing&&!r.waiting&&!Updates.shown)toast("You're up to date.");}
  catch(e){toast(Updates.reg?"Couldn't check for updates. Are you online?":"Updates aren't available in this browser.");}
  btn.disabled=false;
}
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  let firstInstall=!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(firstInstall){firstInstall=false;readVersion();return;}showUpdateBar();});
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").then(r=>{Updates.reg=r;readVersion();}).catch(()=>{}));
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkForUpdate().catch(()=>{});});
  setInterval(()=>checkForUpdate().catch(()=>{}),30*60*1000);
}

})();
