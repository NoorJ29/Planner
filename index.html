<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner</title>
<meta name="theme-color" content="#0F7B6C">
<meta name="description" content="Plan your days, build habits, keep notes and track spending, synced across your devices.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="preload" as="script" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
<script src="config.js"></script>
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunken:#E3E9E6; --ink:#16302B; --muted:#5B6F6A; --line:#D3DCD8;
  --accent:#0F7B6C; --accent-ink:#FFFFFF; --sun:#E9A21F; --danger:#B8433A; --good:#1E8A4C;
  --shadow:0 10px 30px rgba(22,48,43,.14);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1917; --surface:#15231F; --sunken:#1B2C28; --ink:#E4EEEA; --muted:#93A9A3; --line:#284039;
    --accent:#3DB8A2; --accent-ink:#06201B; --sun:#F2B544; --danger:#E0786E; --good:#5CC98A; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1917; --surface:#15231F; --sunken:#1B2C28; --ink:#E4EEEA; --muted:#93A9A3; --line:#284039;
  --accent:#3DB8A2; --accent-ink:#06201B; --sun:#F2B544; --danger:#E0786E; --good:#5CC98A; --shadow:0 10px 30px rgba(0,0,0,.45);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 200px}
body.noqa .wrap{padding-bottom:130px}
.ico{display:inline-flex}
.ico svg{width:22px;height:22px}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ttl{min-width:0}
.date-big{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,50px);line-height:.95;letter-spacing:-.02em;margin:0}
.date-sub{color:var(--muted);margin-top:6px;font-size:15px}
.hact{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto}
.hbtn{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;border:0;background:transparent;border-radius:10px;padding:6px 2px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--accent)}
.sync.offline i{background:var(--sun)}
.sync.error i{background:var(--danger)}

/* segmented controls */
.calbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.seg{display:inline-flex;background:var(--sunken);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.jump{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:3px;background:var(--sunken);border-radius:14px;padding:4px;margin-top:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 0;font-weight:600;font-size:13.5px;color:var(--muted);min-width:0}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* week strip */
.strip-row{margin:8px -18px 0;padding:0 18px}
.strip{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:4px 2px 6px}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 52px;scroll-snap-align:center;border:0;background:transparent;border-radius:16px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .wd{font-size:12px;color:var(--muted)}
.day .dn{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1}
.day .dots{display:flex;gap:3px;height:6px;margin-top:3px}
.day .dots b{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.today .dn{color:var(--sun)}
.day.sel{background:var(--ink);color:var(--bg)}
.day.sel .wd{color:inherit;opacity:.7}
.day.sel .dots b{background:var(--bg)}
.day.past:not(.sel){opacity:.55}

/* month */
.month{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 8px 10px;touch-action:pan-y}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 6px 8px}
.mhead h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0;letter-spacing:-.01em}
.mnav{border:0;background:var(--sunken);width:38px;height:38px;border-radius:12px;font-size:18px;line-height:1;color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mwd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 6px}
.mc{border:0;background:transparent;border-radius:12px;min-height:48px;display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;gap:4px;min-width:0}
.mc .num{font-weight:600;font-size:15px;line-height:1.2}
.mc.has{background:var(--sunken)}
.mc.out{opacity:.35}
.mc.today .num{color:var(--sun);font-weight:800}
.mc.sel{background:var(--ink);color:var(--bg)}
.mc.sel .num{color:var(--bg)}
.mdots{display:flex;gap:2px;align-items:center;height:7px}
.mdots b{width:6px;height:6px;border-radius:50%}
.mdots i{font-style:normal;font-size:10px;font-weight:700;color:var(--muted);line-height:7px}
.mc.sel .mdots i{color:var(--bg)}
.mc.sel .mdots b{outline:1px solid var(--bg)}
.mc.late .mdots b{background:var(--danger)!important}
.mdone{font-size:11px;line-height:7px;color:var(--accent)}
.msum{font-size:13px;color:var(--muted);padding:10px 6px 0}

/* sections & cards */
.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sec-h .n{color:var(--muted);font-size:14px}
.sec-h.overdue h2{color:var(--danger)}
.progress{height:5px;background:var(--sunken);border-radius:5px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.progress.over b{background:var(--danger)}
.sec .progress{margin:-2px 0 12px}
.ldot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.cards{display:grid;gap:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:22px 18px;color:var(--muted);text-align:center}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.linkbtn.danger{color:var(--danger)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunken)}
.btn.danger{background:transparent;color:var(--danger);padding-left:4px;padding-right:4px}
.btn.wide{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}

/* tasks */
.tasks{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.task{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.check{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:2px solid var(--c,var(--accent));background:transparent;display:grid;place-items:center;padding:0;margin-top:-1px;transition:background .15s}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:.15s;stroke:var(--surface)}
.task.done .check,.check.on{background:var(--c,var(--accent))}
.task.done .check svg,.check.on svg{opacity:1;transform:none}
.check.sm{flex-basis:22px;width:22px;height:22px}
.check.sm svg{width:12px;height:12px}
.tbody{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.ttitle{display:block;font-weight:500;overflow-wrap:anywhere}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);margin-top:3px}
.meta .late{color:var(--danger);font-weight:600}
.pri{font-family:var(--display);font-weight:800;color:var(--sun);flex:0 0 auto;font-size:15px;padding-top:1px}
.pri.p2{color:var(--danger)}

/* schedule */
.anytime{display:flex;gap:8px;flex-wrap:wrap}
.tl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:copy}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hr span{position:absolute;left:8px;top:-1px;font-size:11px;color:var(--muted);background:var(--surface);padding:0 4px;transform:translateY(-50%)}
.hr:first-child{border-top:0}
.hr:first-child span{transform:none;top:4px}
.blk{position:absolute;border-radius:10px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface));padding:5px 30px 5px 8px;overflow:hidden;cursor:pointer;font-size:13px;line-height:1.25;min-height:22px}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{color:var(--muted);font-size:12px}
.blk.done b{text-decoration:line-through;opacity:.6}
.blk.drag{box-shadow:var(--shadow);z-index:3;opacity:.95}
.grip{position:absolute;right:2px;top:2px;width:26px;height:26px;border:0;background:transparent;color:var(--muted);touch-action:none;cursor:grab;font-size:14px;line-height:1;border-radius:8px}
.now{position:absolute;left:44px;right:0;border-top:2px solid var(--danger);pointer-events:none;z-index:2}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 78%,transparent)}
.qa{max-width:720px;margin:0 auto 8px;display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow)}
body.noqa .qa{display:none}
.qa input{flex:1;min-width:0;border:0;background:transparent;padding:10px;font-size:16px;outline:none}
.qa .more{border:0;background:var(--sunken);border-radius:12px;width:44px;font-size:20px;color:var(--muted)}
.qa .add{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 18px;font-weight:600}
.nav{max-width:720px;margin:0 auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px;box-shadow:var(--shadow)}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border-radius:15px;color:var(--muted);font-size:11px;font-weight:600;min-width:0}
.nav button[aria-current="page"]{color:var(--accent);background:var(--sunken)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,20,17,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;overscroll-behavior:contain}
.sheet.full{height:92%;display:flex;flex-direction:column}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;padding-bottom:20px}.sheet.full{height:86%}}
.sheet h3{font-family:var(--display);font-size:20px;margin:0 0 14px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.shead h3{margin:0}
.field{margin-top:16px}
.field > label,.field > .lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.lbl-in{font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.inp.title{font-size:19px;font-weight:600}
.inp.amt{font-family:var(--display);font-size:34px;font-weight:700;text-align:center;padding:14px}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .inp{flex:1;min-width:120px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:flex;gap:10px;margin-top:22px;align-items:center}
.sheet:not(.full) .actions{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--surface);margin:22px -20px calc(-20px - env(safe-area-inset-bottom,0px));padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:1}
.actions .primary{flex:1}
.subrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.inp.sub{padding:8px 10px;font-size:15px}
.x{border:0;background:none;color:var(--muted);font-size:22px;width:34px;height:34px;border-radius:10px;flex:0 0 auto}
.listrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.listrow .inp{flex:1}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emojis button{border:1px solid transparent;background:var(--bg);border-radius:10px;font-size:20px;padding:6px 0}
.emojis button[aria-pressed="true"]{border-color:var(--ink)}
.note-body{flex:1;min-height:200px;border:0;background:transparent;resize:none;font-size:16px;line-height:1.6;padding:4px 2px;outline:none;width:100%}
.note-title{border:0;background:transparent;font-family:var(--display);font-weight:700;font-size:24px;padding:4px 2px;outline:none;width:100%}
.saved{font-size:12px;color:var(--muted)}

/* habits */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.htop{display:flex;align-items:center;gap:12px}
.hemo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 18%,var(--surface));flex:0 0 auto}
.hname{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0}
.hname b{display:block;font-weight:600;overflow-wrap:anywhere}
.hname span{font-size:13px;color:var(--muted)}
.hbig{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--c);background:transparent;display:grid;place-items:center;flex:0 0 auto}
.hbig svg{width:22px;height:22px;stroke:var(--c)}
.hbig.on{background:var(--c)}
.hbig.on svg{stroke:var(--surface)}
.hbig.off{opacity:.35}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;text-align:center}
.week7 small{font-size:11px;color:var(--muted)}
.hd{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:transparent;margin:3px auto 0;display:block;padding:0}
.hd.on{background:var(--c)}
.hd.na{border-style:dashed;opacity:.35}
.hd.fut{opacity:.2;pointer-events:none}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;margin-top:8px}
.heat i{width:100%;aspect-ratio:1;border-radius:4px;background:var(--sunken)}
.heat i.on{background:var(--c)}
.heat i.miss{background:color-mix(in srgb,var(--danger) 25%,var(--sunken))}
.heat i.none{background:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700}
.stat span{font-size:12px;color:var(--muted)}
.stats.two{grid-template-columns:repeat(2,1fr)}

/* notes */
.ncard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.ncard b{display:block;font-weight:600;overflow-wrap:anywhere}
.ncard p{margin:4px 0 0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.ncard .small{margin-top:6px}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;font-size:22px;line-height:1.1;min-width:58px}
.moods button small{font-size:11px;color:var(--muted)}
.moods button[aria-pressed="true"]{border-color:var(--ink);background:var(--sunken)}

/* money */
.bigamt{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.cat{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.cat .progress{grid-column:2 / 4}
.txn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left}
.txn:first-child{border-top:0}
.txn .em{font-size:20px;width:28px;text-align:center}
.txn .mid{flex:1;min-width:0}
.txn .mid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn .amt{font-weight:600}
.txn .amt.in{color:var(--good)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}

/* more */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:112px}
.mi .e{font-size:26px}
.mi b{font-weight:700;font-family:var(--display);font-size:17px}
.mi span{font-size:13px;color:var(--muted)}
.back{border:0;background:var(--sunken);border-radius:12px;padding:8px 14px;font-weight:600;font-size:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow > div{min-width:0}
.setrow b{display:block;font-weight:600}
.setrow span{font-size:13px;color:var(--muted)}
.setrow select{max-width:48%}

/* search */
.sres{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.sres button{border:0;background:transparent;text-align:left;padding:10px 8px;border-radius:10px}

function openSheet(content,opts){
  opts=opts||{};
  const scrim=h("div",{class:"scrim",onclick:e=>{if(e.target===scrim)close();}});
  const sheet=h("div",{class:"sheet"+(opts.full?" full":""),role:"dialog","aria-modal":"true"},content);
  scrim.append(sheet);document.body.append(scrim);document.body.style.overflow="hidden";
  let closed=false;

  function esc(e){if(e.key==="Escape"&&scrim===[...document.querySelectorAll(".scrim")].pop())close();}
  document.addEventListener("keydown",esc);
  return close;
}

function clean(x){const o=JSON.parse(JSON.stringify(x));delete o.id;return o;}

const Store={

  stop(){this.unsubs.forEach(f=>{try{f();}catch(e){}});this.unsubs=[];},

  async goCloud(u){

        snap.docChanges().forEach(ch=>{if(ch.type==="removed")D[c].delete(ch.doc.id);else D[c].set(ch.doc.id,Object.assign({id:ch.doc.id},ch.doc.data()));});

  async writeMany(items){for(let i=0;i<items.length;i+=400){const b=fbDb.batch();items.slice(i,i+400).forEach(([c,x])=>b.set(this.base.collection(c).doc(x.id),clean(x)));await b.commit();}},
  fail(e){console.error(e);toast(e&&e.code==="permission-denied"?"Sync was refused. Check the database rules in Firebase (setup guide, step 1).":"Couldn't sync that change yet. It will retry when you're back online.");},
  put(c,x){D[c].set(x.id,x);render();if(this.mode==="cloud")this.base.collection(c).doc(x.id).set(clean(x)).catch(e=>this.fail(e));else this._persist();},
  del(c,id){D[c].delete(id);render();if(this.mode==="cloud")this.base.collection(c).doc(id).delete().catch(e=>this.fail(e));else this._persist();},
  settings(patch){Object.assign(SET,patch);render();if(this.mode==="cloud")this.base.set(clean(patch),{mergeFields:Object.keys(patch)}).catch(e=>this.fail(e));else this._persist();},
  async importAll(data){
    const items=[];COLS.forEach(c=>(Array.isArray(data[c])?data[c]:[]).forEach(x=>{if(x&&x.id){D[c].set(x.id,x);items.push([c,x]);}}));

    render();
    if(this.mode==="cloud"){await this.writeMany(items);if(st)await this.base.set(clean(st),{merge:true});}else this._persist();
    return items.length;
  }
};

function updateSync(forced){

  document.querySelectorAll(".sync").forEach(el=>{el.className="sync "+mode;el.querySelector("span").textContent=label;});
}
window.addEventListener("online",()=>updateSync());window.addEventListener("offline",()=>updateSync());

function authMsg(e){const c=(e&&e.code)||"";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return"That email and password don't match. Check them, or create an account.";
  if(c.includes("email-already-in-use"))return"There's already an account with that email. Sign in instead.";
  if(c.includes("weak-password"))return"Use a password with at least 6 characters.";
  if(c.includes("invalid-email"))return"That doesn't look like an email address.";
  if(c.includes("network"))return"No internet connection. Connect and try again.";
  if(c.includes("too-many-requests"))return"Too many attempts. Wait a minute and try again.";
  if(c.includes("operation-not-allowed"))return"Email sign-in isn't switched on in Firebase yet (setup guide, step 1).";

function remindAt(t){const [H,M]=(t.time||"09:00").split(":").map(Number);const d=fromKey(t.date);d.setHours(H,M,0,0);return d.getTime()-Number(t.remind)*60000;}
const Notify={
  timers:[],
  ok(){return "Notification" in window;},
  on(){return this.ok()&&Notification.permission==="granted"&&lsGet("planner.notif","0")==="1";},
  async enable(){
    if(!this.ok()){toast("This browser can't show notifications.");return;}
    let p=Notification.permission;if(p!=="granted")p=await Notification.requestPermission();
    if(p==="granted"){lsSet("planner.notif","1");this.schedule();this.show("Notifications are on","Task reminders and check-ins will appear here.","test");}
    else toast("Notifications are blocked. Allow them for this app in your phone's settings.");
    render();
  },
  disable(){lsSet("planner.notif","0");this.clear();render();},
  clear(){this.timers.forEach(clearTimeout);this.timers=[];},
  show(title,body,tag){
    const opts={body,tag,icon:"icon-192.png",badge:"icon-192.png",data:{url:"./"}};
    const plain=()=>{try{new Notification(title,opts);}catch(e){}};
    if("serviceWorker" in navigator&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,opts)).catch(plain);else plain();
  },
  fired(){try{return new Set(JSON.parse(localStorage.getItem("planner.fired")||"[]"));}catch(e){return new Set();}},
  mark(k){lsSet("planner.fired",JSON.stringify([...this.fired(),k].slice(-300)));},
  schedule(){
    this.clear();if(!this.on())return;
    const now=Date.now(),hz=now+36*3600e3,fired=this.fired();
    const add=(at,k,fn)=>{if(at<now-60000||at>hz||fired.has(k))return;this.timers.push(setTimeout(()=>{if(this.fired().has(k))return;this.mark(k);fn();},Math.max(0,at-now)));};
    for(const t of D.tasks.values()){
      if(t.done||t.remind==null||t.remind===""||!t.date)continue;
      const at=remindAt(t);
      add(at,"t:"+t.id+":"+at,()=>{const c=D.tasks.get(t.id);if(c&&!c.done)this.show(c.title,[c.time?fmtTime(c.time):"",relLabel(c.date)].filter(Boolean).join(", "),"t-"+c.id);});
    }
    const nudge=(pref,tag,fn)=>{const v=lsGet(pref,"");if(!v)return;const [H,M]=v.split(":").map(Number);for(const off of [0,1]){const d=addDays(new Date(),off);d.setHours(H,M,0,0);add(d.getTime(),tag+":"+key(d),fn);}};
    nudge("planner.habitNudge","h",()=>{const left=vals("habits").filter(x=>!x.archived&&habitDue(x,new Date())&&!(x.log&&x.log[todayKey()]));if(left.length)this.show("Habit check-in",plural(left.length,"habit")+" left today: "+left.slice(0,3).map(x=>x.name).join(", "),"habits");});
    nudge("planner.journalNudge","j",()=>{if(!D.notes.has("j-"+todayKey()))this.show("Journal","How was your day? Take two minutes to write it down.","journal");});
  }
};

const REPEATS=[["","Never"],["daily","Daily"],["weekdays","Weekdays"],["weekly","Weekly"],["monthly","Monthly"],["yearly","Yearly"]];
const REPEAT_LABEL=Object.fromEntries(REPEATS);
const REMINDS=[["","No reminder"],["0","At the time"],["5","5 min before"],["15","15 min before"],["30","30 min before"],["60","1 hour before"],["1440","1 day before"]];
const DURS=[15,30,45,60,90,120,180,240];

function newTask(p){return Object.assign({id:uid(),title:"",date:null,time:"",duration:30,listId:SET.lists[0]?SET.lists[0].id:"",priority:0,notes:"",done:false,createdAt:Date.now(),repeat:"",remind:"",subtasks:[],goalId:""},p);}
function nextDate(k,r){
  const step=x=>{const d=fromKey(x);
    if(r==="daily")return key(addDays(d,1));
    if(r==="weekdays"){let y=addDays(d,1);while(y.getDay()===0||y.getDay()===6)y=addDays(y,1);return key(y);}
    if(r==="weekly")return key(addDays(d,7));
    const months=r==="yearly"?12:1;const y=new Date(d.getFullYear(),d.getMonth()+months,1);
    y.setDate(Math.min(d.getDate(),new Date(y.getFullYear(),y.getMonth()+1,0).getDate()));return key(y);};
  let n=step(k),guard=0;const tk=todayKey();
  while(n<tk&&guard++<800)n=step(n);
  return n;
}
function completeTask(t){
  const prev=snap("tasks",t.id)||clone(t);
  if(!t.done&&navigator.vibrate)navigator.vibrate(12);
  if(!t.done&&t.repeat&&t.date){
    const nd=nextDate(t.date,t.repeat),cid=uid();
    Store.put("tasks",Object.assign(clone(t),{id:cid,done:true,doneAt:Date.now(),repeat:"",remind:"",repeatOf:t.id}));
    Store.put("tasks",Object.assign(clone(t),{date:nd,subtasks:(t.subtasks||[]).map(s=>Object.assign({},s,{done:false}))}));
    undoable("Done. Next one: "+relLabel(nd),[["tasks",null,cid],["tasks",prev,t.id]]);
  }else{
    Store.put("tasks",Object.assign(clone(t),{done:!t.done,doneAt:!t.done?Date.now():null}));
    if(!t.done)undoable("Nice, “"+snippetT(t.title)+"” done",[["tasks",prev,t.id]]);
  }
}
const snippetT=s=>s.length>28?s.slice(0,27)+"…":s;
function sortTasks(a,b){if(a.done!==b.done)return a.done?1:-1;const at=a.time||"99",bt=b.time||"99";if(at!==bt)return at<bt?-1:1;if((b.priority||0)!==(a.priority||0))return(b.priority||0)-(a.priority||0);return(a.createdAt||0)-(b.createdAt||0);}

function gcalUrl(t){

function applyLinkFilter(){

/* open every link in a category */

    go.onclick=()=>{close();openAll.confirmed=true;openAll(items,catName);openAll.confirmed=false;};return;

function openOneByOne(list,openedN,catName){

      rows.append(h("a",{class:"oborow"+(isDone?" done":""),href:l.url,target:"_blank",rel:"noopener noreferrer",onclick:()=>{done.add(l.id);visit(l);setTimeout(draw,0);}},logo(l,34),h("span",{class:"mid"},h("b",{text:l.name}),h("span",{class:"small muted",text:domainOf(l.url)})),h("span",{class:"obost",text:isDone?"✓ Opened":"Open ↗"})));});

    next,rows]);
}

  const bulkBox=h("div",{class:"field",hidden:true},h("label",{text:"Links"}),many,h("div",{class:"small muted",style:"margin-top:6px",text:"Names are filled in from each address. You can rename them after."}));

  const noteF=h("div",{class:"field"},h("label",{text:"Note"}),note);
  const save=h("button",{class:"btn primary",text:isNew?"Save link":"Save"}),cancel=h("button",{class:"btn ghost",text:"Cancel"}),del=isNew?null:h("button",{class:"btn danger",text:"Delete"});
  const openBtn=isNew?null:h("a",{class:"chip",href:d.url,target:"_blank",rel:"noopener noreferrer",text:"Open ↗",onclick:()=>setTimeout(()=>visit(d),50)});
  const close=openSheet([h("div",{class:"shead"},h("h3",{text:isNew?"Add a link":"Edit link"}),openBtn),single,bulkBox,bulkToggle,
    h("div",{class:"field"},h("span",{class:"lbl",text:"Category"}),catBox),noteF,h("div",{class:"actions"},del,cancel,save)]);

function quickAddLink(text){

/* ================= main ================= */
function setHeader(big,sub){$("#bigDate").textContent=big;$("#subDate").textContent=sub||"";}
const TABS=[["plan","Plan"],["habits","Habits"],["notes","Notes"],["money","Money"],["links","Links"],["more","More"]];
function goTab(t){if(t!=="links")UI.linkEdit=false;UI.tab=t;if(t!=="more")UI.page=null;render();window.scrollTo(0,0);}
let rafId=0;
function render(){if(rafId)return;rafId=requestAnimationFrame(()=>{rafId=0;draw();});}
function draw(){
  buildIndex();
  const tab=UI.tab,qaOn=tab==="plan"||tab==="links"||(tab==="more"&&UI.page==="shopping");
  if(tab!=="links")document.body.classList.remove("editing");
  const ae=document.activeElement,refocus=ae&&ae.id&&$("#main").contains(ae)?{id:ae.id,a:ae.selectionStart,b:ae.selectionEnd}:null;
  document.body.classList.toggle("noqa",!qaOn);
  document.querySelectorAll("#nav button,#sideNav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  document.body.classList.toggle("desk",UI.desktop);
  const main=$("#main");main.textContent="";
  if(!UI.ready){setHeader("Planner","");main.append(h("div",{class:"loading",text:"Loading your planner…"}));return;}
  ({plan:renderPlan,habits:renderHabits,notes:renderNotes,money:renderMoney,links:renderLinks,more:renderMore})[tab](main);
  if(refocus){const el=document.getElementById(refocus.id);if(el){el.focus({preventScroll:true});try{el.setSelectionRange(refocus.a,refocus.b);}catch(e){}}}
  const qi=$("#qaInput");
  qi.placeholder=tab==="plan"?(UI.planView==="lists"?"Add a task (no date)":"Add a task for "+(UI.planView==="upcoming"?"today":relLow(UI.sel))):tab==="links"?"Paste a link to save it":"Add an item, e.g. 2 kg rice";
  scheduleNotify();
  if(pending||sharedText)setTimeout(runPending,0);
}

/* quick add */
$("#qaForm").addEventListener("submit",e=>{e.preventDefault();const qi=$("#qaInput");const v=qi.value.trim();if(!v)return;
  if(UI.tab==="links"){if(quickAddLink(v))qi.value="";return;}
  if(UI.tab==="more"&&UI.page==="shopping"){const p=parseItem(v);Store.put("shop",{id:uid(),listId:UI.shopList,name:p.name,qty:p.qty,done:false,createdAt:Date.now()});}
  else{const date=UI.planView==="lists"?null:(UI.planView==="upcoming"?todayKey():UI.sel);Store.put("tasks",newTask({title:v,date}));toast("Added to "+(date?relLabel(date):"your lists"));}
  qi.value="";});
$("#qaMore").addEventListener("click",()=>{const qi=$("#qaInput");const v=qi.value.trim();
  if(UI.tab==="more"&&UI.page==="shopping"){$("#qaForm").requestSubmit();return;}
  if(UI.tab==="links"){qi.value="";openLink(null,v?{url:normalizeUrl(v)||v}:null);return;}
  const ti=openTask(null);if(v){ti.value=v;qi.value="";}});

/* nav */
const nav=$("#nav"),sideNav=$("#sideNav");
TABS.forEach(([t,l],i)=>{nav.append(h("button",{"data-tab":t,"aria-label":l,onclick:()=>goTab(t)},ico(t),h("span",{text:l})));
  sideNav.append(h("button",{"data-tab":t,onclick:()=>goTab(t)},ico(t),h("span",{text:l}),h("kbd",{text:String(i+1)})));});
$("#searchBtn").append(ico("search"));$("#searchBtn").addEventListener("click",openSearch);
$("#sideSearch").prepend(ico("search"));$("#sideSearch").addEventListener("click",openSearch);
document.querySelectorAll(".sync").forEach(b=>b.addEventListener("click",openAccount));
MQ.addEventListener("change",()=>{UI.desktop=MQ.matches;render();});
function openGuide(){UI.tab="more";UI.page="guide";render();window.scrollTo(0,0);}
$("#sideGuide").addEventListener("click",openGuide);

/* keyboard shortcuts (laptop) */
function newInSection(){
  const t=UI.tab;
  if(t==="plan")openTask(null);
  else if(t==="habits")openHabit(null);
  else if(t==="notes"){if(UI.notesSeg==="journal")openJournal(todayKey());else openNote(null);}
  else if(t==="money")openExpense(null);
  else if(t==="links")openLink(null);
  else if(t==="more"&&UI.page==="goals")openGoal(null);
  else if(t==="more"&&UI.page==="shopping")$("#qaInput").focus();
  else openTask(null);
}
document.addEventListener("keydown",e=>{
  const el=e.target,typing=el&&(/^(input|textarea|select)$/i.test(el.tagName)||el.isContentEditable);
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(!$(".scrim"))openSearch();return;}
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){const sc=[...document.querySelectorAll(".scrim")].pop();const p=sc&&sc.querySelector(".btn.primary");if(p){e.preventDefault();p.click();}return;}
  if(typing||e.metaKey||e.ctrlKey||e.altKey||$(".scrim"))return;
  const k=e.key;
  if(k==="/"){e.preventDefault();openSearch();}
  else if(k==="n"||k==="N"){e.preventDefault();newInSection();}
  else if(/^[1-6]$/.test(k))goTab(TABS[Number(k)-1][0]);
  else if(UI.tab==="plan"&&(k==="t"||k==="T")){UI.stripScroll=null;pickDay(todayKey());}
  else if(UI.tab==="plan"&&(k==="ArrowLeft"||k==="ArrowRight")){e.preventDefault();UI.stripScroll=null;pickDay(key(addDays(fromKey(UI.sel),k==="ArrowLeft"?-1:1)));}
  else if(k==="q"&&!document.body.classList.contains("noqa")){e.preventDefault();$("#qaInput").focus();}
  else if(k==="?"){e.preventDefault();openGuide();}
});

/* home-screen shortcuts & share target */
const params=new URLSearchParams(location.search);
let pending=params.get("a");
let sharedText=[params.get("text"),params.get("url")].filter(Boolean).join("\n");
const sharedTitle=params.get("title");
if(pending||sharedText||sharedTitle)history.replaceState(null,"",location.pathname);
if(sharedTitle&&!sharedText)sharedText=sharedTitle;
function runPending(){
  if(!UI.ready||$(".scrim"))return;
  if(sharedText){
    const urls=extractUrls(sharedText),rest=sharedText.replace(/https?:\/\/\S+/g,"").trim();
    if(urls.length===1&&rest.length<80){const u=urls[0];const x={id:uid(),url:u,name:(sharedTitle&&sharedTitle.length<60&&!/^https?:/.test(sharedTitle))?sharedTitle:niceName(u),catId:(SET.linkCats[0]||{}).id||"",note:rest.slice(0,200),visits:0,createdAt:Date.now()};
      const txt=sharedText;sharedText="";Store.put("links",x);UI.tab="links";render();
      toast("Saved to Links",{label:"Save as note instead",fn:()=>{Store.del("links",x.id);const n=newNote({title:x.name,body:txt});Store.put("notes",n);UI.tab="notes";UI.notesSeg="notes";render();}});return;}
    const n=newNote({title:sharedTitle&&sharedTitle!==sharedText?sharedTitle:"Saved "+new Date().toLocaleDateString(),body:sharedText});sharedText="";Store.put("notes",n);UI.tab="notes";UI.notesSeg="notes";render();toast("Saved to Notes");openNote(n);return;}
  const a=pending;pending=null;
  if(a==="task"){UI.tab="plan";render();openTask(null);}
  else if(a==="expense"){UI.tab="money";render();openExpense(null);}
  else if(a==="note"){UI.tab="notes";UI.notesSeg="notes";render();openNote(null);}
  else if(a==="journal"){UI.tab="notes";UI.notesSeg="journal";render();openJournal(todayKey());}
}

applyTheme();
render();
Store.init();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}

})();
